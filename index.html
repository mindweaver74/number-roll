<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>숫자 하나 굴리기</title>
<style>
  html, body {
    margin: 0; padding: 0; overflow: hidden;
    background: #0f1220;
    height: 100%;
    touch-action: manipulation;
    -webkit-user-select: none; user-select: none;
    font-family: 'Segoe UI', 'Malgun Gothic', sans-serif;
  }
  #wrap {
    display: flex; justify-content: center; align-items: center;
    height: 100vh; width: 100vw;
  }
  canvas {
    background: linear-gradient(#1a1f3a, #0f1220);
    display: block;
    max-width: 100vw; max-height: 100vh;
    touch-action: none;
  }
</style>
</head>
<body>
<div id="wrap"><canvas id="game"></canvas></div>
<script>
(function(){
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');

  // Logical resolution (portrait)
  const W = 400, H = 700;
  canvas.width = W; canvas.height = H;

  function fitCanvas() {
    const scale = Math.min(window.innerWidth / W, window.innerHeight / H);
    canvas.style.width = (W * scale) + 'px';
    canvas.style.height = (H * scale) + 'px';
  }
  window.addEventListener('resize', fitCanvas);
  fitCanvas();

  // ---------- Audio (simple WebAudio beeps, no external files) ----------
  let actx = null;
  function ensureAudio(){ if(!actx){ try{ actx = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } }
  function beep(freq, dur, type, vol){
    if(!actx) return;
    const o = actx.createOscillator();
    const g = actx.createGain();
    o.type = type || 'sine';
    o.frequency.value = freq;
    g.gain.value = vol || 0.15;
    o.connect(g); g.connect(actx.destination);
    o.start();
    g.gain.exponentialRampToValueAtTime(0.001, actx.currentTime + dur);
    o.stop(actx.currentTime + dur);
  }
  function sfxScore(){ beep(660, 0.08, 'square', 0.12); }
  function sfxStar(){ beep(440,0.05,'sine',0.15); setTimeout(()=>beep(880,0.12,'sine',0.18),40); }
  function sfxHit(){ beep(120, 0.35, 'sawtooth', 0.2); }

  // ---------- Game state ----------
  const STATE = { START: 0, PLAY: 1, OVER: 2 };
  let state = STATE.START;

  let bestScore = parseInt(localStorage.getItem('numberRollBest') || '0', 10);

  const GRAVITY = 1150;      // px/s^2 (완화됨)
  const JUMP_V = -370;       // px/s (완화됨)
  const BALL_R = 16;
  const BALL_X = 110;

  let ball, pipes, particles, score, gameTime, pipeTimer, speed, shake, flash;

  function resetGame(){
    ball = { y: H/2, vy: 0, rot: 0 };
    pipes = [];
    particles = [];
    score = 0;
    gameTime = 0;
    pipeTimer = 0;
    speed = 145; // base horizontal scroll speed px/s (완화됨)
    shake = 0;
    flash = 0;
  }
  resetGame();

  const GAP_START = 250, GAP_MIN = 190;                  // 완화됨 (넓은 간격)
  const PIPE_INTERVAL_START = 1.5, PIPE_INTERVAL_MIN = 1.15; // 완화됨

  function difficultyProgress(){
    // 0 -> 1 over ~75 seconds of play time, clamped (천천히 어려워짐)
    return Math.min(gameTime / 75, 1);
  }

  function spawnPipe(){
    const t = difficultyProgress();
    const gap = GAP_START - (GAP_START - GAP_MIN) * t;
    const margin = 60;
    const gapY = margin + Math.random() * (H - margin*2 - gap);
    const isStarPipe = Math.random() < 0.16; // rare multiplier pipe
    pipes.push({
      x: W + 40,
      gapY, gap,
      passed: false,
      star: isStarPipe,
      starGrabbed: false
    });
  }

  function addParticle(x, y, text, color){
    particles.push({x, y, text, color, life: 0.7, t: 0});
  }

  function jump(){
    if(state === STATE.START){
      ensureAudio();
      state = STATE.PLAY;
      resetGame();
      ball.vy = JUMP_V;
      return;
    }
    if(state === STATE.PLAY){
      ball.vy = JUMP_V;
    }
    if(state === STATE.OVER){
      ensureAudio();
      state = STATE.PLAY;
      resetGame();
      ball.vy = JUMP_V;
    }
  }

  window.addEventListener('keydown', (e)=>{ if(e.code==='Space'){ e.preventDefault(); jump(); }});
  canvas.addEventListener('mousedown', jump);
  canvas.addEventListener('touchstart', (e)=>{ e.preventDefault(); jump(); }, {passive:false});

  let lastTime = performance.now();
  function loop(now){
    let dt = (now - lastTime) / 1000;
    if(dt > 0.05) dt = 0.05; // clamp for tab-switch spikes
    lastTime = now;
    update(dt);
    render();
    requestAnimationFrame(loop);
  }

  function update(dt){
    if(shake > 0) shake -= dt;
    if(flash > 0) flash -= dt * 2.5;

    for(const p of particles){ p.t += dt; }
    particles = particles.filter(p => p.t < p.life);

    if(state !== STATE.PLAY) return;

    gameTime += dt;
    const t = difficultyProgress();
    speed = 145 + 60 * t; // 완화됨

    // ball physics
    ball.vy += GRAVITY * dt;
    ball.y += ball.vy * dt;
    ball.rot = Math.max(-0.5, Math.min(1.2, ball.vy / 500));

    if(ball.y - BALL_R < 0){ ball.y = BALL_R; ball.vy = 0; }
    if(ball.y + BALL_R > H){ return gameOver(); }

    // pipes
    pipeTimer += dt;
    const interval = PIPE_INTERVAL_START - (PIPE_INTERVAL_START - PIPE_INTERVAL_MIN) * t;
    if(pipeTimer >= interval){
      pipeTimer = 0;
      spawnPipe();
    }

    const PIPE_W = 56;
    for(const p of pipes){
      p.x -= speed * dt;

      // collision with pipe body
      if(BALL_X + BALL_R > p.x && BALL_X - BALL_R < p.x + PIPE_W){
        if(ball.y - BALL_R < p.gapY || ball.y + BALL_R > p.gapY + p.gap){
          return gameOver();
        }
      }

      // star grab (in the middle of the gap)
      if(p.star && !p.starGrabbed){
        const starX = p.x + PIPE_W/2;
        const starY = p.gapY + p.gap/2;
        const dx = BALL_X - starX, dy = ball.y - starY;
        if(Math.sqrt(dx*dx+dy*dy) < BALL_R + 14){
          p.starGrabbed = true;
          const mult = Math.random() < 0.5 ? 2 : 3;
          score = Math.round(score * mult);
          flash = 1;
          shake = 0.25;
          sfxStar();
          addParticle(starX, starY, '×' + mult, '#ffd54a');
        }
      }

      // score on pass
      if(!p.passed && p.x + PIPE_W < BALL_X - BALL_R){
        p.passed = true;
        const inc = 1 + Math.floor(Math.random()*2); // +1 or +2
        score += inc;
        sfxScore();
        addParticle(BALL_X, ball.y - 20, '+' + inc, '#7ee787');
      }
    }
    pipes = pipes.filter(p => p.x > -80);
  }

  function gameOver(){
    state = STATE.OVER;
    shake = 0.4;
    sfxHit();
    if(score > bestScore){
      bestScore = score;
      localStorage.setItem('numberRollBest', String(bestScore));
    }
  }

  // ---------- Render ----------
  function render(){
    ctx.save();
    let sx = 0, sy = 0;
    if(shake > 0){
      const mag = shake * 10;
      sx = (Math.random()-0.5) * mag;
      sy = (Math.random()-0.5) * mag;
    }
    ctx.clearRect(0,0,W,H);
    ctx.translate(sx, sy);

    // background subtle grid
    ctx.fillStyle = '#141833';
    ctx.fillRect(-10,-10,W+20,H+20);
    ctx.strokeStyle = 'rgba(255,255,255,0.03)';
    for(let gx=0; gx<W; gx+=40){ ctx.beginPath(); ctx.moveTo(gx,0); ctx.lineTo(gx,H); ctx.stroke(); }
    for(let gy=0; gy<H; gy+=40){ ctx.beginPath(); ctx.moveTo(0,gy); ctx.lineTo(W,gy); ctx.stroke(); }

    if(state !== STATE.START){
      drawPipes();
      drawBall();
      drawParticles();
    }

    if(flash > 0){
      ctx.fillStyle = 'rgba(255,213,74,' + (flash*0.35) + ')';
      ctx.fillRect(0,0,W,H);
    }

    drawHUD();
    ctx.restore();
  }

  function drawPipes(){
    const PIPE_W = 56;
    for(const p of pipes){
      const grad = ctx.createLinearGradient(p.x,0,p.x+PIPE_W,0);
      grad.addColorStop(0, '#3a7bd5');
      grad.addColorStop(1, '#2c5aa0');
      ctx.fillStyle = grad;
      ctx.fillRect(p.x, 0, PIPE_W, p.gapY);
      ctx.fillRect(p.x, p.gapY + p.gap, PIPE_W, H - (p.gapY+p.gap));
      ctx.fillStyle = 'rgba(255,255,255,0.15)';
      ctx.fillRect(p.x, p.gapY - 10, PIPE_W, 10);
      ctx.fillRect(p.x, p.gapY + p.gap, PIPE_W, 10);

      if(p.star && !p.starGrabbed){
        const starX = p.x + PIPE_W/2;
        const starY = p.gapY + p.gap/2;
        drawStar(starX, starY, 12, '#ffd54a');
      }
    }
  }

  function drawStar(cx, cy, r, color){
    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(performance.now()/400);
    ctx.beginPath();
    for(let i=0;i<5;i++){
      const a1 = (i * 2 * Math.PI/5) - Math.PI/2;
      const a2 = a1 + Math.PI/5;
      ctx.lineTo(Math.cos(a1)*r, Math.sin(a1)*r);
      ctx.lineTo(Math.cos(a2)*(r*0.45), Math.sin(a2)*(r*0.45));
    }
    ctx.closePath();
    ctx.fillStyle = color;
    ctx.shadowColor = color; ctx.shadowBlur = 12;
    ctx.fill();
    ctx.restore();
  }

  function drawBall(){
    ctx.save();
    ctx.translate(BALL_X, ball.y);
    ctx.rotate(ball.rot);
    const grad = ctx.createRadialGradient(-5,-5,2,0,0,BALL_R);
    grad.addColorStop(0, '#ffffff');
    grad.addColorStop(1, '#ff6b6b');
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.arc(0,0,BALL_R,0,Math.PI*2);
    ctx.fill();
    ctx.restore();
  }

  function drawParticles(){
    for(const p of particles){
      const alpha = 1 - (p.t / p.life);
      ctx.globalAlpha = alpha;
      ctx.fillStyle = p.color;
      ctx.font = 'bold 22px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText(p.text, p.x, p.y - p.t*40);
      ctx.globalAlpha = 1;
    }
  }

  function drawHUD(){
    ctx.textAlign = 'center';
    if(state === STATE.START){
      ctx.fillStyle = '#fff';
      ctx.font = 'bold 32px sans-serif';
      ctx.fillText('숫자 하나 굴리기', W/2, H/2 - 60);
      ctx.font = '18px sans-serif';
      ctx.fillStyle = '#aab';
      ctx.fillText('탭 / 스페이스바로 점프', W/2, H/2 - 20);
      ctx.fillText('최고 기록: ' + bestScore, W/2, H/2 + 20);

      // pulsing tap prompt
      const pulse = 0.6 + 0.4*Math.sin(performance.now()/300);
      ctx.globalAlpha = pulse;
      ctx.fillStyle = '#ffd54a';
      ctx.font = 'bold 20px sans-serif';
      ctx.fillText('탭해서 시작', W/2, H/2 + 70);
      ctx.globalAlpha = 1;

      drawStar(W/2 - 60, H/2 + 120, 10, '#ffd54a');
      ctx.fillStyle = '#ddd';
      ctx.font = '14px sans-serif';
      ctx.textAlign = 'left';
      ctx.fillText('= 배율 별 (점수 × 2~3)', W/2 - 42, H/2 + 125);
      return;
    }

    // score top-center, big
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 44px sans-serif';
    ctx.fillText(String(score), W/2, 70);

    if(state === STATE.OVER){
      ctx.fillStyle = 'rgba(10,12,25,0.72)';
      ctx.fillRect(0, H/2 - 110, W, 220);

      ctx.fillStyle = '#fff';
      ctx.font = 'bold 26px sans-serif';
      ctx.fillText('게임 종료', W/2, H/2 - 55);

      ctx.font = 'bold 40px sans-serif';
      ctx.fillStyle = '#ffd54a';
      ctx.fillText(String(score), W/2, H/2);

      ctx.font = '16px sans-serif';
      ctx.fillStyle = '#ccc';
      const newBest = score >= bestScore && score > 0;
      ctx.fillText(newBest ? '★ 신기록! ★' : ('최고 기록: ' + bestScore), W/2, H/2 + 30);

      ctx.fillStyle = '#7ee787';
      ctx.font = 'bold 18px sans-serif';
      ctx.fillText('탭해서 다시하기', W/2, H/2 + 75);
    }
  }

  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
